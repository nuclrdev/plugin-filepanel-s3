# Ukrainian texts of the S3 file panel plugin; keys and placeholders mirror messages.properties.
# Use the typographic apostrophe ’ (U+2019), never ', which MessageFormat treats as a quote.
# Glossary (as in filepanel-fs): file - файл, folder - тека, panel - панель, bucket - бакет,
# object - об’єкт, profile - профіль, connection - підключення, secret key - секретний ключ.

